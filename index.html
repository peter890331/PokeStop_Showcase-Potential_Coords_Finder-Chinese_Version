<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可補給站選秀會 - 潛在座標查詢器 - 中文版</title>
  <link rel="icon" href="https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/my_icon.png">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 80vh;
      margin-top: 50px;
      margin-left: 15px;
      margin-right: 15px;
      background-color: #7bcff7;
    }
    footer {
      background-color: #54ddf5;
      color: #fff;
      padding: 0px;
      text-align: center;
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 12px;
    }
    h1 {
      font-size: 20px;
      text-align: center;
    }
    #formContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }
    label {
      margin-bottom: 20px;
      font-size: 15px;
      text-align: center;
    }
    input {
      margin-bottom: 0px;
      padding: 8px;
    }
    #confirmButtonContainer {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    #confirmButton {
      margin-left: 10px;
      margin-bottom: 0px;
      padding: 8px 15px;
      cursor: pointer;
    }
    #result {
      position: relative;
      margin-top: 10px;
      width: 100%;
      max-width: 320px;
      text-align: left;
      word-break: break-all;
    }
    .copyButton {
      width: 100%;
    }
    .loading-container {
      display: none;
      align-items: center;
      justify-content: center;
    }
    #paginationContainer {
      display: grid;
      grid-template-columns: 80px auto 80px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 320px;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 150px;
    }
    #paginationContainer button {
      width: 100%;
      padding: 5px 0;
      cursor: pointer;
    }

    /* 手機版專用 RWD 樣式 */
    @media screen and (max-width: 600px) {
      /* 1. 隱藏右下角皮卡丘與對話框 */
      img[alt="pikachu.png"], 
      img[alt="pikachu_say_yes.png"], 
      img[alt="pikachu_say_no.png"], 
      img[alt="pikachu_say_hi.png"], 
      img[alt="pikachu_say_plz.png"] {
        display: none !important;
      }

      /* 2. 標題手機版自動換行並去掉橫線 */
      h1 {
        font-size: 18px;
        padding: 0 10px;
      }
      .mobile-break {
        display: block;
      }
      .mobile-break::before {
        content: ""; 
      }

      /* 3. 標籤與按鈕區塊改為上下排列 */
      label {
        font-size: 14px;
        padding: 0 10px;
      }
      #confirmButtonContainer {
        flex-direction: column;
        width: 100%;
      }
      #confirmButton {
        margin-left: 0;
        margin-top: 15px;
        width: 120px;
      }
      input[type="datetime-local"] {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/pokemon_go_icon.png" alt="pokemon_go_icon.png" style="width: auto; height: 100px;">
  <div style="position: relative;">
    <!-- 透過 span 配合 CSS 達成電腦版同一行、手機版自動換行 -->
    <h1>寶可補給站選秀會 - 潛在座標查詢器 <span class="mobile-break">中文版</span></h1>
    <img src="https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/showcase_icon.png" alt="showcase_icon.png" style="width: auto; height: 75%; position: absolute; top: -10px; left: 50px; z-index: -1; transform: rotate(-20deg);">
    <img src="https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/taiwan.png" alt="taiwan.png" style="width: auto; height: 75%; position: absolute; top: 2px; right: 15px; z-index: -1; transform: rotate(10deg);">
  </div>
  <div id="formContainer">
    <label for="datetime">請選擇寶可補給站選秀會在您當前時區結束的日期與時間：</label>
    <div id="confirmButtonContainer">
      <input type="datetime-local" id="datetime" name="datetime">
      <button id="confirmButton">確定</button>
    </div>
    <div class="loading-container" id="loadingContainer">
      <img src="https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/loading.gif" alt="Loading..." style="width: 50px; height: auto;">
    </div>
    <p id="result"></p>
    <div id="paginationContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>
  <script src="https://unpkg.com/browser-geo-tz@latest/dist/geotz.js"></script>

  <script>
    dayjs.extend(window.dayjs_plugin_utc);
    dayjs.extend(window.dayjs_plugin_timezone);

    let allMatches = [];
    let currentPage = 1;
    const itemsPerPage = 20;

    async function getLocalTimeAndUTCOffset(latitude, longitude, selectedDateTime) {
      try {
        var timezoneId = await GeoTZ.find(latitude, longitude);
        var nowDate = dayjs.utc();
        const localTime = dayjs(nowDate).tz(timezoneId[0]);
        const utcOffset = localTime.utcOffset() / 60;
        var d = new Date();
        var gmtHours = -d.getTimezoneOffset() / 60;
        const timeDiff = selectedDateTime.diff(nowDate.add(-gmtHours + utcOffset, "hour"), "minute");
        const hoursDiff = Math.floor(timeDiff / 60);
        const minutesDiff = timeDiff % 60;
        
        return { localTime, utcOffset, hoursDiff, minutesDiff };
      } 
      catch (error) {
        return null;
      }
    }

    document.getElementById("confirmButton").addEventListener("click", async function() {
        var selectedDateTime = new Date(document.getElementById("datetime").value);

        if (isNaN(selectedDateTime.getTime())) {
          showWarningMessage("請選擇日期與時間！");
          return;
        }

        if (selectedDateTime.getTime() < Date.now()) {
          showWarningMessage("選擇的時間已在過去，請重新選擇！");
          return;
        }

        document.getElementById("loadingContainer").style.display = "flex";
        document.getElementById("result").style.display = "none";
        document.getElementById("paginationContainer").style.display = "none";

        selectedDateTime = dayjs(selectedDateTime);
        const coordinates = await fetchCoordinates();
        allMatches = [];
        
        const processPromises = coordinates.map(async (coordinate) => {
            const latitude = coordinate[0];
            const longitude = coordinate[1];
            const result = await getLocalTimeAndUTCOffset(latitude, longitude, selectedDateTime);

            if (!result) return null; 
            const { localTime, utcOffset, hoursDiff, minutesDiff } = result;

            if (localTime && localTime.format("MM/DD HH:mm") < selectedDateTime.format("MM/DD HH:mm")) {
                const Diff = Math.abs(localTime.format("MMDDHHmm") - selectedDateTime.format("MMDDHHmm"));
                return { coordinate, utcOffset, hoursDiff, minutesDiff, Diff }; 
            }
            return null;
        });

        const resultsArray = await Promise.all(processPromises);
        
        resultsArray.forEach(match => {
            if (match) allMatches.push(match);
        });

        allMatches.sort((a, b) => a.Diff - b.Diff);

        document.getElementById("loadingContainer").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("paginationContainer").style.display = "grid";

        currentPage = 1;
        renderResults();
        renderPagination();
    });

    function renderResults() {
        const resultElement = document.getElementById("result");
        
        if (allMatches.length > 0) {
          let resultText = "最接近的潛在座標：<br><br>";
          
          const startIndex = (currentPage - 1) * itemsPerPage;
          const endIndex = startIndex + itemsPerPage;
          const pageMatches = allMatches.slice(startIndex, endIndex);

          for (const match of pageMatches) {
              const coordinate = match.coordinate;
              let utcOffset = match.utcOffset;
              let hoursDiff = match.hoursDiff;
              let minutesDiff = match.minutesDiff;
              if (utcOffset >= 0) {
                utcOffset = `+${utcOffset}`;
              }
              const formattedCoordinate = coordinate.map(coord => coord.toFixed(5));
              resultText += `UTC ${utcOffset}，剩餘時間 ${hoursDiff} 小時 ${minutesDiff} 分鐘：<br>「${formattedCoordinate[0]}, ${formattedCoordinate[1]}」<br><button class="copyButton" onclick='copyToClipboard("${formattedCoordinate[0]}, ${formattedCoordinate[1]}")'>複製</button><br><br>`;
          }
          resultElement.innerHTML = resultText;
          show_pikachu_say_yes_Image();
        } 
        else {
          resultElement.innerHTML = "找不到符合條件的潛在座標。";
          show_pikachu_say_no_Image();
        }
    }

    function renderPagination() {
        const paginationContainer = document.getElementById("paginationContainer");
        paginationContainer.innerHTML = "";
        
        if (allMatches.length <= itemsPerPage) {
            return;
        }

        const totalPages = Math.ceil(allMatches.length / itemsPerPage);

        const prevButton = document.createElement("button");
        prevButton.innerText = "上一頁";
        if (currentPage > 1) {
            prevButton.addEventListener("click", () => {
                currentPage--;
                renderResults();
                renderPagination();
                window.scrollTo({ top: document.getElementById("result").offsetTop - 100, behavior: "smooth" });
            });
        } else {
            prevButton.style.visibility = "hidden";
        }
        paginationContainer.appendChild(prevButton);

        const pageIndicator = document.createElement("div");
        pageIndicator.innerText = `第 ${currentPage} / ${totalPages} 頁`;
        pageIndicator.style.textAlign = "center";
        paginationContainer.appendChild(pageIndicator);

        const nextButton = document.createElement("button");
        nextButton.innerText = "下一頁";
        if (currentPage < totalPages) {
            nextButton.addEventListener("click", () => {
                currentPage++;
                renderResults();
                renderPagination();
                window.scrollTo({ top: document.getElementById("result").offsetTop - 100, behavior: "smooth" });
            });
        } else {
            nextButton.style.visibility = "hidden";
        }
        paginationContainer.appendChild(nextButton);
    }

    async function fetchCoordinates() {
      try {
        const response = type = await fetch("https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_Coords_Finder-Coords_Database/master/coordinates.json");
        return await response.json();
      } 
      catch (error) {
        return [];
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text)
        .then(() => {
          const alertBox = document.createElement("div");
          alertBox.innerHTML = "座標已複製到剪貼簿";
          alertBox.id = "alertBox";
          alertBox.style.cssText = `
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #5fb4f5;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            z-index: 9999;
          `;
          document.body.appendChild(alertBox);
          setTimeout(function() {
            alertBox.parentNode.removeChild(alertBox);
          }, 2000); 
        })
        .catch(() => {});
    }

    function showWarningMessage(message) {
      const alertBox = document.createElement("div");
      alertBox.innerHTML = message;
      alertBox.id = "alertBox";
      alertBox.style.cssText = `
          position: fixed;
          bottom: 10%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: #f55f5f; 
          color: white;
          padding: 15px 30px;
          border-radius: 5px;
          z-index: 9999;
      `;
      document.body.appendChild(alertBox);
      setTimeout(function() {
          alertBox.parentNode.removeChild(alertBox);
      }, 3000); 
    }

    function show_pikachu_say_yes_Image() {
      const temporaryImage = document.createElement("img");
      temporaryImage.src = "https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/pikachu_say_yes.png";
      temporaryImage.alt = "pikachu_say_yes.png";
      temporaryImage.style.cssText = `
          width: 200px;
          height: auto;
          position: fixed;
          bottom: 200px;
          right: 120px; 
          z-index: -1;
      `;
      document.body.appendChild(temporaryImage);

      setTimeout(function() {
          temporaryImage.parentNode.removeChild(temporaryImage);
      }, 5000);
    }

    function show_pikachu_say_no_Image() {
      const temporaryImage = document.createElement("img");
      temporaryImage.src = "https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/pikachu_say_no.png";
      temporaryImage.alt = "pikachu_say_no.png";
      temporaryImage.style.cssText = `
          width: 200px;
          height: auto;
          position: fixed;
          bottom: 200px;
          right: 120px; 
          z-index: -1;
      `;
      document.body.appendChild(temporaryImage);

      setTimeout(function() {
          temporaryImage.parentNode.removeChild(temporaryImage);
      }, 5000);
    }

    window.onload = function() {
      setTimeout(function() {
          show_pikachu_say_hi_Image();
      }, 1000); 
    };

    function show_pikachu_say_hi_Image() {
      const temporaryImage = document.createElement("img");
      temporaryImage.src = "https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/pikachu_say_hi.png";
      temporaryImage.alt = "pikachu_say_hi.png";
      temporaryImage.style.cssText = `
          width: 200px;
          height: auto;
          position: fixed;
          bottom: 200px;
          right: 120px; 
          z-index: -1;
      `;
      document.body.appendChild(temporaryImage);

      setTimeout(function() {
          temporaryImage.parentNode.removeChild(temporaryImage);
      }, 5000);
    }

    function show_pikachu_say_plz_Image() {
      const temporaryImage = document.createElement("img");
      temporaryImage.src = "https://raw.githubusercontent.com/peter890331/PokeStop_Showcase-Potential_coords_Finder-Chinese_Version/figures/figures/pikachu_say_plz.png";
      temporaryImage.alt = "pikachu_say_plz.png";
      temporaryImage.style.cssText = `
          width: 200px;
          height: auto;
          position: fixed;
          bottom: 80px;
          right: 120px; 
          z-index: -1;
      `;
      document.body.appendChild(temporaryImage);

      setTimeout(function() {
          temporaryImage.parentNode.removeChild(temporaryImage);
      }, 10000);
    }

    let idleTimeout; 

    function resetIdleTimeout() {
        clearTimeout(idleTimeout);
        startIdleTimeout();
    }

    function startIdleTimeout() {
      idleTimeout = setTimeout(function() {
          show_pikachu_say_plz_Image();
          startIdleTimeout();
      }, 60000); 
    }

    document.addEventListener("mousemove", resetIdleTimeout);
    document.addEventListener("keydown", resetIdleTimeout);
    document.addEventListener("click", resetIdleTimeout);

    startIdleTimeout();

  </script>
